services:
  - type: web
    name: jasyree-api
    runtime: docker
    rootDir: jnovel-backend
    dockerfilePath: ./Dockerfile
    dockerContext: .
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: FRONTEND_URL
        value: https://jasyre.com,https://www.jasyre.com
      - key: DB_HOST
        value: 31.70.138.125
      - key: DB_PORT
        value: "3306"
      - key: DB_NAME
        value: my_app_db
      - key: DB_USER
        value: render_user
      - key: DB_PASS
        value: jasyre@123
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_ACCESS_TTL
        value: "900"
      - key: JWT_REFRESH_TTL
        value: "2592000"
      - key: JWT_ISSUER
        value: jnovel-api
